<!DOCTYPE html>
<html>
<head>
  <title>Robot Delivery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial; background: #1a1a2e; color: white; min-height: 100vh; }
    
    header { background: #16213e; padding: 20px; text-align: center; }
    header h1 { color: #4ecca3; }
    
    #status-bar { background: #0f3460; padding: 10px 20px; text-align: center; font-size: 14px; }
    #status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4ecca3; margin-right: 8px; }
    
    #map-frame { width: 100%; height: 300px; background: #000; border-bottom: 2px solid #444; }
    
    #destinations { padding: 20px; }
    h2 { margin-bottom: 15px; color: #aaa; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    
    .dest-btn {
      display: block; width: 100%; padding: 18px 20px;
      margin: 10px 0; background: #16213e;
      border: 2px solid #0f3460; border-radius: 12px;
      color: white; font-size: 18px; cursor: pointer;
      text-align: left; transition: all 0.2s;
    }
    .dest-btn:hover { border-color: #4ecca3; background: #0f3460; }
    .dest-btn:active { transform: scale(0.98); }
    .dest-btn span { font-size: 13px; color: #aaa; display: block; margin-top: 4px; }
    
    #confirm-modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      align-items: center; justify-content: center;
    }
    #confirm-modal.show { display: flex; }
    .modal-box { background: #16213e; padding: 30px; border-radius: 15px; text-align: center; width: 85%; }
    .modal-box h3 { font-size: 22px; margin-bottom: 10px; }
    .modal-box p { color: #aaa; margin-bottom: 20px; }
    .btn-confirm { background: #4ecca3; color: #1a1a2e; font-size: 18px; font-weight: bold; padding: 15px; width: 100%; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; }

    #going-banner {
      display: none; position: fixed; bottom: 0; left: 0;
      width: 100%; background: #4ecca3; color: #1a1a2e;
      text-align: center; padding: 20px; font-size: 20px; font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <h1>🤖 Robot Delivery</h1>
</header>

<div id="status-bar">
  <span id="status-dot"></span>
  <span id="status-text">Robot ready</span>
</div>

<!-- Live map embed via rosbridge -->
<canvas id="map-frame"></canvas>

<div id="destinations">
  <h2>📍 Choose Destination</h2>
  <div id="dest-list">Loading destinations...</div>
</div>

<!-- Confirmation modal -->
<div id="confirm-modal">
  <div class="modal-box">
    <h3>Send robot to:</h3>
    <p id="modal-dest-name" style="font-size:24px; color:white; font-weight:bold;"></p>
    <p>Are you sure?</p>
    <button class="btn-confirm" onclick="confirmGo()">✅ Yes, Send Robot</button>
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<div id="going-banner" id="going-banner">
  🚀 Robot is on its way!
</div>

<script src="https://cdn.jsdelivr.net/npm/eventemitter2/lib/eventemitter2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>

<script>
  const PC_IP = "192.168.1.100"; // ← change to your PC's IP
  let selectedDest = null;

  // Load destinations from backend
  async function loadDestinations() {
    const res = await fetch('/destinations');
    const data = await res.json();
    const list = document.getElementById('dest-list');
    
    if (Object.keys(data).length === 0) {
      list.innerHTML = '<p style="color:#aaa">No destinations set yet. Ask admin to add some.</p>';
      return;
    }

    list.innerHTML = '';
    for (const [name] of Object.entries(data)) {
      list.innerHTML += `
        <button class="dest-btn" onclick="selectDest('${name}')">
          📍 ${name}
          <span>Tap to send robot here</span>
        </button>`;
    }
  }

  function selectDest(name) {
    selectedDest = name;
    document.getElementById('modal-dest-name').textContent = name;
    document.getElementById('confirm-modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('confirm-modal').classList.remove('show');
    selectedDest = null;
  }

  async function confirmGo() {
    closeModal();
    await fetch(`/go/${encodeURIComponent(selectedDest)}`, { method: 'POST' });
    
    // Show going banner
    const banner = document.getElementById('going-banner');
    banner.style.display = 'block';
    document.getElementById('status-text').textContent = `Going to ${selectedDest}...`;
    
    setTimeout(() => { banner.style.display = 'none'; }, 4000);
  }

  loadDestinations();
</script>

</body>
</html>
